          description: ''
  /api/attachments/:
    get:
      operationId: attachments_list
      description: |-
        Files can only be uploaded (created), retrieved, listed, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: List all uploaded attachments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - attachments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFileAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        Files can only be uploaded (created), retrieved, listed, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: Upload a new attachment (multipart/form-data)
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The binary file to upload
                model_name:
                  type: string
                  description: The target model (e.g., 'question', 'answer','suggestededit')
                object_id:
                  type: integer
                  description: ID of the specific post
              required:
              - file
              - model_name
              - object_id
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
          description: ''
  /api/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        Files can only be uploaded (created), retrieved, listed, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: Get a specific attachment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this file attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        Files can only be uploaded (created), retrieved, listed, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: '[Authors/Admins Only] Delete an attachment'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this file attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
