          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_accepted:
          type: boolean
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FileAttachment'
          readOnly: true
        attachment_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_at_jalali:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_at_jalali:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachments
      - author
      - created_at
      - created_at_jalali
      - id
      - is_accepted
      - question
      - score
      - status
      - updated_at
