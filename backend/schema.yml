        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - last_name
      - role
      - username
    UserStats:
      type: object
      properties:
        total_answers:
          type: integer
          readOnly: true
        total_upvotes:
          type: integer
          readOnly: true
        total_accepted_answers:
          type: integer
          readOnly: true
      required:
      - total_accepted_answers
      - total_answers
      - total_upvotes
    ValueEnum:
      enum:
      - 1
      - -1
      type: integer
      description: |-
        * `1` - 1
        * `-1` - -1
    VoteRequest:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/ValueEnum'
      required:
      - value
    VoteResponse:
      type: object
      properties:
        message:
          type: string
        new_score:
          type: integer
      required:
      - message
      - new_score
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
