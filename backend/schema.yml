  /api/attachments/:
    post:
      operationId: attachments_create
      description: |-
        Files can only be uploaded (created), retrieved, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: Upload a new attachment (multipart/form-data)
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The binary file to upload
              required:
              - file
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
          description: ''
  /api/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        Files can only be uploaded (created), retrieved, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: Get a specific attachment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this file attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        Files can only be uploaded (created), retrieved, and deleted.
        They cannot be edited (updated) once uploaded.
      summary: '[Authors/Admins Only] Delete an attachment'
