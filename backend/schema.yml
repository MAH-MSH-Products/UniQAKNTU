components:
  schemas:
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: integer
        body:
          type: string
          nullable: true
        score:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        author:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_accepted:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_at_jalali:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_at_jalali:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - created_at_jalali
      - id
      - question
      - score
      - status
      - updated_at
      - updated_at_jalali
    AnswerSuggestEditRequest:
      type: object
      properties:
        proposed_text:
          type: string
        removed_attachment_ids:
          type: array
          items:
            type: integer
      required:
      - proposed_text
    AnswerSuggestEditResponse:
      type: object
      properties:
        message:
          type: string
        suggested_edit_id:
          type: integer
      required:
      - message
      - suggested_edit_id
    ApproveEditResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    FileAttachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        model_name:
          allOf:
          - $ref: '#/components/schemas/ModelNameEnum'
          writeOnly: true
          description: |-
            The model you are attaching the file to (e.g., 'question')

            * `question` - question
            * `answer` - answer
            * `suggestededit` - suggestededit
        object_id:
          type: integer
          maximum: 2147483647
          minimum: 0
        attached_to_model:
          type: string
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        uploaded_at_jalali:
          type: string
          format: date-time
          readOnly: true
      required:
      - attached_to_model
      - file
      - id
      - model_name
      - object_id
      - uploaded_at
      - uploaded_at_jalali
    ModelNameEnum:
      enum:
      - question
      - answer
      - suggestededit
      type: string
      description: |-
        * `question` - question
        * `answer` - answer
        * `suggestededit` - suggestededit
    PaginatedAnswerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
    PaginatedFileAttachmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
